* { box-sizing: border-box; }

/* ---------- overlay layout ---------- */
.hud {

.hud > *, .sheet > * { pointer-events: auto; min-width: 0; }
.sheet { display: contents; }
.tabs { display: none; }

.panel {

}

/* ---------- intro ---------- */

.src-link { color: var(--ink-2); text-decoration: underline; text-decoration-color: var(--line-strong); text-underline-offset: 3px; border-radius: 4px; }

/* ---------- controls ---------- */
.tools { grid-area: tools; justify-self: end; align-self: start; display: flex; gap: 8px; align-items: center; }

/* ---------- policy panel ---------- */
.policy { grid-area: policy; align-self: start; max-height: 100%; overflow: auto; padding: 16px 16px 14px; scrollbar-width: thin; }
.presets { margin-top: 10px; display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }

  appearance: none;
  border: 1px solid var(--line-strong);

  border-radius: 12px;
  padding: 8px 10px;

  font-size: 13.5px;

.slider { display: grid; grid-template-columns: 4.2em minmax(0, 1fr) 3.2em; align-items: center; gap: 8px; margin-top: 6px; font-size: 13px; color: var(--ink-2); }

input[type="range"] {
  -webkit-appearance: none;
  appearance: none;
  width: 100%;
  height: 22px;
  background: transparent;
  cursor: pointer;
  margin: 0;
}
input[type="range"]::-webkit-slider-runnable-track { height: 4px; border-radius: 2px; background: linear-gradient(90deg, var(--ink) var(--fill, 50%), var(--chip-hover) var(--fill, 50%)); }

input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 16px; margin-top: -6px; border-radius: 50%; background: var(--panel-solid); border: 2px solid var(--ink); }
input[type="range"]::-moz-range-thumb { width: 12px; height: 12px; border-radius: 50%; background: var(--panel-solid); border: 2px solid var(--ink); }
input[type="range"]:focus-visible { outline: none; }
input[type="range"]:focus-visible::-webkit-slider-thumb { box-shadow: 0 0 0 3px var(--panel-solid), 0 0 0 5px var(--focus); }
input[type="range"]:focus-visible::-moz-range-thumb { box-shadow: 0 0 0 3px var(--panel-solid), 0 0 0 5px var(--focus); }
.pool-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
.pool .seg button { padding: 8px 9px; }
.source { margin: 8px 0 0; font-size: 12.5px; color: var(--ink-3); font-variant-numeric: tabular-nums; }

/* ---------- analysis panel ---------- */
.analysis { grid-area: analysis; align-self: start; max-height: 100%; overflow: auto; padding: 16px 16px 14px; scrollbar-width: thin; }
.readout-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; }
.fetch-id { margin: 2px 0 0; display: flex; align-items: center; gap: 10px; font-size: 40px; line-height: 1.05; font-weight: 700; font-stretch: 112%; font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
.fetch-id .key { width: 12px; height: 26px; border-radius: 4px; }
.fetch-id.is-none { font-size: 22px; font-stretch: 100%; color: var(--ink-2); }
.fetch-id.is-none .key { background: var(--blocked); }
.mini-stats { margin: 0; display: grid; gap: 2px; text-align: right; font-size: 12.5px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.mini-stats b { color: var(--ink); font-weight: 650; font-size: 14px; }
.mini-stats dd { margin: 0; }
.plane { margin: 14px 0 0; }
.plane-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.plane-head h3 { margin: 0; font-size: 13.5px; font-weight: 650; }
.plane-head span { font-size: 12px; color: var(--ink-3); }
#planeSvg { display: block; width: 100%; height: auto; margin-top: 6px; overflow: visible; }
.plane-key { display: grid; gap: 3px; margin-top: 6px; font-size: 12px; color: var(--ink-2); }
.plane-key > span { display: flex; align-items: center; gap: 8px; }
.plane-key svg { width: 16px; height: 12px; flex: none; overflow: visible; }

.plane-key .k-arc { fill: none; stroke: var(--fetch); stroke-width: 1.4; stroke-dasharray: 3 2.5; }
.plane-key .k-front { fill: none; stroke: var(--ink-2); stroke-width: 1.3; }
.plane .axis { stroke: var(--line-strong); stroke-width: 1; }
.plane .grid { stroke: var(--line); stroke-width: 1; }
.plane .tick { fill: var(--ink-3); font-size: 10px; font-variant-numeric: tabular-nums; }
.plane .axis-label { fill: var(--ink-2); font-size: 10.5px; }
.plane .arc { fill: none; stroke: var(--fetch); stroke-width: 1.4; stroke-dasharray: 4 4; opacity: 0.9; }
.plane .arc-fill { fill: var(--fetch); opacity: 0.06; }
.plane .frontier { fill: none; stroke: var(--ink-2); stroke-width: 1.3; stroke-linejoin: round; opacity: 0.7; }
.plane .ideal { fill: var(--ink); }
.plane .pt { transition: transform 360ms cubic-bezier(.2,.7,.2,1); cursor: pointer; }
.plane .pt circle.hit { fill: transparent; }
.plane .pt .dot { stroke: var(--panel-solid); stroke-width: 1.5; }
.plane .pt.s2 .dot { fill: var(--pass); }
.plane .pt.s3 .dot { fill: var(--fetch); }
.plane .pt.s3 .halo { fill: none; stroke: var(--fetch); stroke-width: 1.5; opacity: 0.5; }
.plane .pt.s1 .cross { stroke: var(--blocked); stroke-width: 2; stroke-linecap: round; }
.plane .pt.is-off { opacity: 0.45; }
.plane .pt.is-hover .dot, .plane .pt.is-selected .dot { stroke: var(--ink); stroke-width: 2; }
.plane .pt.is-selected .ring { fill: none; stroke: var(--ink); stroke-width: 1.5; }
.plane .pt-label { fill: var(--ink); font-size: 11px; font-weight: 650; font-variant-numeric: tabular-nums; }
.reason { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--line); }
.reason-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.reason h3 { margin: 0; font-size: 14px; font-weight: 650; display: flex; align-items: center; gap: 8px; }
.reason h3 .key { width: 10px; height: 10px; border-radius: 3px; }
.reason p { margin: 6px 0 0; font-size: 13px; color: var(--ink-2); }
.reason p b { color: var(--ink); font-weight: 650; }
.text-btn { appearance: none; border: 0; background: none; padding: 0; font-size: 12.5px; font-weight: 600; color: var(--ink); cursor: pointer; text-decoration: underline; text-decoration-color: var(--line-strong); text-underline-offset: 3px; border-radius: 4px; white-space: nowrap; }
.text-btn:hover { text-decoration-color: currentColor; }
.terms { width: 100%; margin-top: 10px; border-collapse: collapse; font-size: 12.5px; font-variant-numeric: tabular-nums; }
.terms th, .terms td { padding: 4px 0 4px 12px; text-align: right; }
.terms th:first-child, .terms td:first-child { text-align: left; color: var(--ink-2); font-weight: 400; padding-left: 0; }
.terms thead th { color: var(--ink-3); font-weight: 560; border-bottom: 1px solid var(--line); }
.terms tbody td { border-bottom: 1px solid var(--line); }
.terms tfoot td { font-weight: 650; color: var(--ink); padding-top: 6px; }
.terms .bar-cell { width: 34%; padding-left: 10px; }
.terms .bars { display: grid; gap: 2px; }
.terms .bars i { display: block; height: 4px; border-radius: 2px; min-width: 1px; }
.terms .bars .b-sel { background: var(--ink-2); }
.terms .bars .b-fetch { background: var(--fetch); opacity: 0.8; }
.terms td.is-zero { color: var(--ink-3); }
.repro { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--line); }
.repro p { margin: 0 0 6px; font-size: 12.5px; color: var(--ink-3); }
.code-row { display: flex; align-items: stretch; gap: 6px; }
.code-row code { flex: 1; min-width: 0; font-family: var(--mono); font-size: 11.5px; line-height: 1.45; padding: 7px 9px; border-radius: 8px; background: var(--chip); color: var(--ink-2); overflow-wrap: anywhere; }
.code-row button { appearance: none; border: 1px solid var(--line-strong); background: transparent; border-radius: 8px; padding: 0 10px; font-size: 12.5px; font-weight: 600; cursor: pointer; color: var(--ink); }
.code-row button:hover { background: var(--chip); }
.legend { list-style: none; margin: 14px 0 0; padding: 12px 0 0; border-top: 1px solid var(--line); display: grid; grid-template-columns: 1fr 1fr; gap: 6px 10px; font-size: 12.5px; color: var(--ink-2); }
.legend li { display: flex; align-items: center; gap: 8px; }
.key { display: inline-block; flex: none; width: 12px; height: 10px; border-radius: 3px; }
.key-fetch { background: var(--fetch); }
.key-pass { background: var(--pass); }
.key-other { background: var(--other); }
.key-blocked { background: var(--blocked); }
.key-over { background: repeating-linear-gradient(135deg, var(--cap-a) 0 3px, var(--cap-b) 3px 6px); }
.key-ideal { width: 10px; height: 10px; border-radius: 0; background: var(--ink); clip-path: polygon(50% 0, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%); }

/* ---------- rounds ---------- */
.rounds { grid-area: rounds; align-self: end; justify-self: center; width: min(660px, 100%); padding: 10px 14px 10px; }
.rounds-head { display: flex; align-items: center; gap: 12px; }
.rounds-head .icon-btn { width: 36px; height: 36px; background: transparent; border-color: var(--line-strong); -webkit-backdrop-filter: none; backdrop-filter: none; }

.rounds-head .slider { margin: 0 0 0 auto; width: min(240px, 46%); grid-template-columns: auto minmax(60px, 1fr) 2.2em; }
.strip { list-style: none; margin: 8px 0 0; padding: 0; display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 3px; }
.strip button {
  appearance: none;
  width: 100%;
  border: 1px solid transparent;
  background: var(--chip);
  border-radius: 8px;
  padding: 4px 0 5px;
  cursor: pointer;
  display: grid;
  gap: 1px;
  font-variant-numeric: tabular-nums;
  position: relative;

.tags { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
.tag {

  font-size: 12.5px;
  font-weight: 620;

.tag.is-shown { opacity: 1; }
.tag .key { width: 8px; height: 8px; border-radius: 50%; }
.tag-thr, .tag-layer { font-weight: 560; color: var(--ink-2); }
.tag-thr .key { width: 12px; height: 2px; border-radius: 1px; }
.tag-layer .key { width: 12px; height: 2px; border-radius: 1px; background: var(--ink-3); }

.tooltip {
  position: fixed;

// Mechanism
// ===================================================================
// @lab-core-begin
// Python-compatible random: MT19937 seeded like random.Random(int), plus
// getrandbits / _randbelow / randint / choice / random(). Layer 1 (fraud) uses
// exactly the stream of multi-dimensional-choices.py, so the "Original rule"
// policy reproduces the Python script and the classic view.
const MT_N = 624, MT_M = 397;
class PyRandom {
  constructor(seed = 0) { this.mt = new Uint32Array(MT_N); this.index = MT_N + 1; if (Array.isArray(seed)) this.initByArray(seed); else this.seed(seed); }
  seed(a) {
    let n = Math.abs(Math.trunc(Number(a) || 0));
    const key = [];
    if (n === 0) key.push(0);
    while (n > 0) { key.push(n % 4294967296); n = Math.floor(n / 4294967296); }
    this.initByArray(key);
  }
  initGenrand(s) {
    const mt = this.mt;
    mt[0] = s >>> 0;
    for (let i = 1; i < MT_N; i++) {
      const prev = mt[i - 1] ^ (mt[i - 1] >>> 30);
      mt[i] = (Math.imul(1812433253, prev) + i) >>> 0;
    }
    this.index = MT_N;
  }
  initByArray(key) {
    const mt = this.mt;
    this.initGenrand(19650218);
    let i = 1, j = 0;
    for (let k = Math.max(MT_N, key.length); k > 0; k--) {
      const prev = mt[i - 1] ^ (mt[i - 1] >>> 30);
      mt[i] = ((mt[i] ^ Math.imul(prev, 1664525)) + (key[j] >>> 0) + j) >>> 0;
      i++; j++;
      if (i >= MT_N) { mt[0] = mt[MT_N - 1]; i = 1; }
      if (j >= key.length) j = 0;
    }
    for (let k = MT_N - 1; k > 0; k--) {
      const prev = mt[i - 1] ^ (mt[i - 1] >>> 30);
      mt[i] = ((mt[i] ^ Math.imul(prev, 1566083941)) - i) >>> 0;
      i++;
      if (i >= MT_N) { mt[0] = mt[MT_N - 1]; i = 1; }
    }
    mt[0] = 0x80000000;
  }
  uint32() {
    const mt = this.mt;
    let y;
    if (this.index >= MT_N) {
      let kk = 0;
      for (; kk < MT_N - MT_M; kk++) {
        y = (mt[kk] & 0x80000000) | (mt[kk + 1] & 0x7fffffff);
        mt[kk] = mt[kk + MT_M] ^ (y >>> 1) ^ ((y & 1) ? 0x9908b0df : 0);
      }
      for (; kk < MT_N - 1; kk++) {
        y = (mt[kk] & 0x80000000) | (mt[kk + 1] & 0x7fffffff);
        mt[kk] = mt[kk + (MT_M - MT_N)] ^ (y >>> 1) ^ ((y & 1) ? 0x9908b0df : 0);
      }
      y = (mt[MT_N - 1] & 0x80000000) | (mt[0] & 0x7fffffff);
      mt[MT_N - 1] = mt[MT_M - 1] ^ (y >>> 1) ^ ((y & 1) ? 0x9908b0df : 0);
      this.index = 0;
    }
    y = mt[this.index++];
    y ^= y >>> 11;
    y ^= (y << 7) & 0x9d2c5680;
    y ^= (y << 15) & 0xefc60000;
    y ^= y >>> 18;
    return y >>> 0;
  }
  getrandbits(k) { return this.uint32() >>> (32 - k); }
  randbelow(n) {
    const k = 32 - Math.clz32(n);
    let r = this.getrandbits(k);
    while (r >= n) r = this.getrandbits(k);
    return r;
  }
  randint(a, b) { return a + this.randbelow(b - a + 1); }
  choice(seq) { return seq[this.randbelow(seq.length)]; }
  random() { const a = this.uint32() >>> 5, b = this.uint32() >>> 6; return (a * 67108864 + b) / 9007199254740992; }
  snapshot() { return { mt: Uint32Array.from(this.mt), index: this.index }; }
  static fromSnapshot(snap) { const r = new PyRandom(0); r.mt.set(snap.mt); r.index = snap.index; return r; }
}

// Same result as wanted_threshold() in the Python script (integer sums are
// exact, so the prefix-sum form gives bit-identical averages), in O(n log n).
function wantedThreshold(values) {
  const ordered = Float64Array.from(values).sort();
  const n = ordered.length;
  if (n < 4 || ordered[0] === ordered[n - 1]) return ordered[0];
  const minimum = ordered[0], maximum = ordered[n - 1];
  const m = n - 2;
  if (m < 2) return minimum;
  const s1 = new Float64Array(m + 1), s2 = new Float64Array(m + 1);
  for (let i = 0; i < m; i++) { const v = ordered[i + 1]; s1[i + 1] = s1[i] + v; s2[i + 1] = s2[i] + v * v; }
  let bestSplit = 0, bestValue = Infinity;
  for (let split = 0; split < m - 1; split++) {
    const a = split + 1, b = m - a;
    const lowSum = s1[a], lowSq = s2[a];
    const highSum = s1[m] - s1[a], highSq = s2[m] - s2[a];
    const value = (lowSq - 2 * minimum * lowSum + a * minimum * minimum) / a
      + (highSq - 2 * maximum * highSum + b * maximum * maximum) / b;
    if (value < bestValue) { bestValue = value; bestSplit = split; }
  }
  return (s1[m] - s1[bestSplit + 1]) / (m - (bestSplit + 1));
}

const SCORE_MAX = 50;
const CAP_OFF = 50;          // a cap of 50 can never be exceeded, so it means "no cap"
const ROUND_COUNT = 12;
const TAG_LAYER = 0x6c617972; // derived streams for the extra layers
const TAG_DRIFT = 0x64726966; // derived streams for round-to-round drift
const clampScore = (v) => Math.min(SCORE_MAX, Math.max(0, v));

function stream(seed, tag, index) {
  const s = Math.abs(Math.trunc(Number(seed) || 0));
  return new PyRandom([s % 4294967296, Math.floor(s / 4294967296), tag, index]);
}

function gaussian(rng) {
  const u1 = 1 - rng.random(), u2 = rng.random();
  return Math.sqrt(-2 * Math.log(u1)) * Math.cos(2 * Math.PI * u2);
}

// Base pool: wanted and fraud come from the Python stream. Credit risk leans
// against fraud risk (so the layers trade off and weights matter) and a little
// with wanted; compliance is mostly clean with a heavy tail of serious flags.
function generateWorld(n, seed) {
  const rng = new PyRandom(seed);
  const wanted = Array.from({ length: n }, () => rng.randint(0, SCORE_MAX));
  const fraud = Array.from({ length: n }, () => rng.randint(0, SCORE_MAX));
  const tieState = rng.snapshot();
  const creditStream = stream(seed, TAG_LAYER, 1);
  const credit = wanted.map((w, i) => clampScore(Math.round(0.25 * w + 0.65 * (SCORE_MAX - fraud[i]) + 18 * creditStream.random() - 8)));
  const complianceStream = stream(seed, TAG_LAYER, 2);
  const compliance = wanted.map(() => { const r = complianceStream.random(); return clampScore(Math.round(SCORE_MAX * (r * r * r))); });
  const noise = [];
  for (let t = 1; t < ROUND_COUNT; t++) {
    const drift = stream(seed, TAG_DRIFT, t);
    noise.push([0, 1, 2, 3].map(() => Float64Array.from({ length: n }, () => gaussian(drift))));
  }
  return { n, seed, base: { wanted, risks: [fraud, credit, compliance] }, tieState, noise };
}

// Round 0 is the base pool; each later round is a bounded random walk whose
// step size is the volatility. The same noise is reused for every volatility.
function buildRounds(world, volatility) {
  const rounds = [world.base];
  for (let t = 1; t < ROUND_COUNT; t++) {
    const prev = rounds[t - 1];
    const z = world.noise[t - 1];
    const step = (series, s) => series.map((v, i) => clampScore(Math.round(v + volatility * z[s][i])));
    rounds.push({ wanted: step(prev.wanted, 0), risks: prev.risks.map((series, k) => step(series, k + 1)) });
  }
  return rounds;
}

// Three stages: wanted threshold (unchanged), hard caps per risk layer, then
// the smallest weighted squared distance to the ideal point
// (max wanted, zero on every risk layer). Status: 0 below threshold,
// 1 blocked by a cap, 2 survivor, 3 fetched.
function decide(data, policy, tieState) {
  const { wanted, risks } = data;
  const n = wanted.length, K = risks.length;
  const threshold = wantedThreshold(wanted);
  let maxWanted = -Infinity;
  for (const w of wanted) if (w > maxWanted) maxWanted = w;
  let considered = [];
  for (let i = 0; i < n; i++) if (wanted[i] >= threshold) considered.push(i);
  if (!considered.length) considered = wanted.flatMap((w, i) => (w === maxWanted ? [i] : []));
  const status = new Uint8Array(n);
  const gap2 = new Float64Array(n).fill(NaN);
  const terms = Array.from({ length: K }, () => new Float64Array(n).fill(NaN));
  const dist = new Float64Array(n).fill(NaN);
  const violations = new Map();
  const survivors = [];
  for (const i of considered) {
    const g = (maxWanted - wanted[i]) ** 2;
    gap2[i] = g;
    let d = g;
    for (let k = 0; k < K; k++) {
      const term = policy.weights[k] * risks[k][i] ** 2;
      terms[k][i] = term;
      d += term;
    }
    dist[i] = d;
    const over = [];
    for (let k = 0; k < K; k++) if (policy.caps[k] < CAP_OFF && risks[k][i] > policy.caps[k]) over.push(k);
    if (over.length) { violations.set(i, over); status[i] = 1; }
    else { status[i] = 2; survivors.push(i); }
  }
  let best = Infinity;
  for (const i of survivors) if (dist[i] < best) best = dist[i];
  const finalists = survivors.filter((i) => dist[i] === best);
  let fetch = -1;
  if (finalists.length) {
    fetch = PyRandom.fromSnapshot(tieState).choice(finalists);
    status[fetch] = 3;
  }
  const ranking = [...survivors].sort((a, b) => (dist[a] - dist[b]) || ((b === fetch) - (a === fetch)) || (a - b));
  return { threshold, maxWanted, considered, survivors, finalists, fetch, best, status, gap2, terms, dist, violations, ranking };
}

(function readUrl() {
  const p = new URLSearchParams(location.search);
  const n = parseInt(p.get('n'), 10);
  if (Number.isFinite(n) && n >= 1 && n <= 900) {
    const pool = POOLS.find((x) => x.n === n);
    state.n = n;
    state.cols = pool ? pool.cols : Math.ceil(Math.sqrt(n));
    const seedText = p.get('seed');
    if (seedText !== null && /^\d{1,15}$/.test(seedText)) {
      state.seed = Number(seedText);
      state.kind = pool && pool.seed === state.seed ? pool.kind : 'random';
    } else if (pool) {
      state.seed = pool.seed;
      state.kind = pool.kind;
    } else {
      state.seed = 1;
      state.kind = 'random';
    }
  }
  const preset = p.get('policy');
  if (preset && POLICIES[preset]) {
    state.weights = [...POLICIES[preset].weights];
    state.caps = [...POLICIES[preset].caps];
  }
  const w = (p.get('w') || '').split(',').map(Number);
  if (w.length === 3 && w.every((v) => Number.isFinite(v) && v >= 0 && v <= WEIGHT_MAX)) state.weights = w;
  const c = (p.get('c') || '').split(',').map(Number);
  if (c.length === 3 && c.every((v) => Number.isInteger(v) && v >= 0 && v <= CAP_OFF)) state.caps = c;
  const vol = Number(p.get('vol'));
  if (p.has('vol') && Number.isFinite(vol) && vol >= 0 && vol <= 10) state.volatility = Math.round(vol * 2) / 2;
  const round = parseInt(p.get('round'), 10);
  if (Number.isFinite(round) && round >= 1 && round <= ROUND_COUNT) state.round = round - 1;
})();

let world = null;
let rounds = null;
let decisions = null;
let trail = [];

function policy() { return { weights: state.weights, caps: state.caps }; }
function activePreset() {
  for (const [name, p] of Object.entries(POLICIES)) {
    if (p.weights.every((v, k) => Math.abs(v - state.weights[k]) < 1e-9) && p.caps.every((v, k) => v === state.caps[k])) return name;
  }
  return null;
}
function rebuildWorld() { world = generateWorld(state.n, state.seed); trail = []; }
function rebuildRounds() { rounds = buildRounds(world, state.volatility); }
function rebuildDecisions() { decisions = rounds.map((data) => decide(data, policy(), world.tieState)); }
const current = () => decisions[state.round];
const currentData = () => rounds[state.round];

let urlTimer = 0;
function syncUrl() {
  clearTimeout(urlTimer);
  urlTimer = setTimeout(() => {
    const p = new URLSearchParams(location.search);
    p.set('n', String(state.n));
    p.set('seed', String(state.seed));
    const preset = activePreset();
    p.delete('policy'); p.delete('w'); p.delete('c');
    if (preset) p.set('policy', preset);
    else { p.set('w', state.weights.map((v) => +v.toFixed(2)).join(',')); p.set('c', state.caps.join(',')); }
    p.set('vol', String(state.volatility));
    if (state.round > 0) p.set('round', String(state.round + 1)); else p.delete('round');
    history.replaceState(null, '', `${location.pathname}?${p.toString()}${location.hash}`);
  }, 250);
}

    b.setAttribute('aria-label', t('roundButton', { r: r + 1, f: f < 0 ? '—' : `#${f}` }));
  });
  const counts = new Map();
  fetches.forEach((f) => { if (f >= 0) counts.set(f, (counts.get(f) || 0) + 1); });
  const empty = fetches.filter((f) => f < 0).length;
  const changes = fetches.slice(1).filter((f, i) => f !== fetches[i]).length;
  let text = '';
  if (counts.size) {
    const [id, c] = [...counts.entries()].sort((a, b) => (b[1] - a[1]) || (a[0] - b[0]))[0];

  }
  if (empty) text += (text ? ' ' : '') + t('stabilityNone', { z: empty, k: ROUND_COUNT });
  els.stability.innerHTML = text;
}

// ---------- decision plane ----------
const PLANE = { x0: 40, y0: 248, size: 240 };
let planeNodes = null;
function buildPlaneNodes() {
  const NS = 'http://www.w3.org/2000/svg';
  els.planeSvg.innerHTML = `
    <g class="frame"></g>
    <path class="arc-fill"></path>
    <path class="arc"></path>
    <path class="frontier"></path>
    <g class="pts"></g>
    <path class="ideal" d=""></path>
    <text class="pt-label" id="planeFetchLabel"></text>`;
  const ptsGroup = els.planeSvg.querySelector('.pts');
  planeNodes = [];
  for (let i = 0; i < state.n; i++) {
    const g = document.createElementNS(NS, 'g');
    g.setAttribute('class', 'pt');
    g.dataset.id = String(i);
    g.innerHTML = '<circle class="hit" r="9"></circle><circle class="halo" r="9"></circle><circle class="ring" r="8.5"></circle><circle class="dot" r="4.5"></circle><path class="cross" d="M-3.6 -3.6 L3.6 3.6 M3.6 -3.6 L-3.6 3.6"></path>';
    g.style.display = 'none';
    ptsGroup.append(g);
    planeNodes.push(g);
  }
}

function planeCoords(d, data, id) {
  const gx = d.maxWanted - data.wanted[id];
  let s = 0;
  for (let k = 0; k < 3; k++) s += state.weights[k] * data.risks[k][id] ** 2;
  return [gx, Math.sqrt(s)];
}

function renderPlane() {
  const d = current(), data = currentData();
  const coords = new Map();
  let maxCoord = 1;
  for (const id of d.considered) {
    const c = planeCoords(d, data, id);
    coords.set(id, c);
    maxCoord = Math.max(maxCoord, c[0], c[1]);
  }
  let D;
  if (d.fetch >= 0) D = Math.min(Math.max(2.6 * Math.sqrt(d.best), 8), maxCoord * 1.06);
  else D = maxCoord * 1.06;
  D = Math.max(D, 4);
  const { x0, y0, size } = PLANE;
  const sx = (v) => x0 + (Math.min(v, D) / D) * size;
  const sy = (v) => y0 - (Math.min(v, D) / D) * size;
  const ticks = [0, D / 2, D];
  const fmtTick = (v) => (D < 10 ? v.toFixed(1) : Math.round(v).toString());
  els.planeSvg.querySelector('.frame').innerHTML =
    ticks.map((v) => `<line class="grid" x1="${sx(v)}" y1="${y0}" x2="${sx(v)}" y2="${y0 - size}"/><line class="grid" x1="${x0}" y1="${sy(v)}" x2="${x0 + size}" y2="${sy(v)}"/>`).join('')
    + `<line class="axis" x1="${x0}" y1="${y0}" x2="${x0 + size}" y2="${y0}"/><line class="axis" x1="${x0}" y1="${y0}" x2="${x0}" y2="${y0 - size}"/>`
    + ticks.map((v) => `<text class="tick" x="${sx(v)}" y="${y0 + 13}" text-anchor="middle">${fmtTick(v)}</text>`).join('')
    + ticks.slice(1).map((v) => `<text class="tick" x="${x0 - 6}" y="${sy(v) + 3.5}" text-anchor="end">${fmtTick(v)}</text>`).join('')
    + `<text class="axis-label" x="${x0 + size / 2}" y="${y0 + 32}" text-anchor="middle">${t('axisX')}</text>`
    + `<text class="axis-label" transform="translate(${x0 - 28} ${y0 - size / 2}) rotate(-90)" text-anchor="middle">${t('axisY')}</text>`;
  const star = (cx, cy, r) => {
    let p = '';
    for (let i = 0; i < 10; i++) {
      const a = -Math.PI / 2 + (i * Math.PI) / 5;
      const rr = i % 2 ? r * 0.45 : r;
      p += `${i ? 'L' : 'M'}${(cx + rr * Math.cos(a)).toFixed(2)} ${(cy + rr * Math.sin(a)).toFixed(2)}`;
    }
    return `${p}Z`;
  };
  els.planeSvg.querySelector('.ideal').setAttribute('d', star(x0, y0, 6));
  const arc = els.planeSvg.querySelector('.arc');
  const arcFill = els.planeSvg.querySelector('.arc-fill');
  if (d.fetch >= 0 && d.best > 0) {
    const r = (Math.sqrt(d.best) / D) * size;
    const rr = Math.min(r, size * 1.5);
    arc.setAttribute('d', `M ${x0 + rr} ${y0} A ${rr} ${rr} 0 0 0 ${x0} ${y0 - rr}`);
    arcFill.setAttribute('d', `M ${x0} ${y0} L ${x0 + rr} ${y0} A ${rr} ${rr} 0 0 0 ${x0} ${y0 - rr} Z`);
  } else {
    arc.setAttribute('d', '');
    arcFill.setAttribute('d', '');
  }
  // frontier: survivors not beaten on both axes
  const surv = d.survivors.map((id) => [id, ...coords.get(id)]).sort((a, b) => (a[1] - b[1]) || (a[2] - b[2]));
  const front = [];
  let minY = Infinity;
  for (const p of surv) if (p[2] < minY) { front.push(p); minY = p[2]; }
  let path = '';
  front.forEach((p, i) => {
    const x = sx(p[1]), y = sy(p[2]);
    if (i === 0) path += `M ${x} ${sy(Math.min(D, p[2] + D))}` + ` L ${x} ${y}`;
    else path += ` L ${x} ${sy(front[i - 1][2])} L ${x} ${y}`;
  });
  if (front.length) path += ` L ${sx(D)} ${sy(front[front.length - 1][2])}`;
  els.planeSvg.querySelector('.frontier').setAttribute('d', path);
  let off = 0;
  planeNodes.forEach((g, id) => {
    const c = coords.get(id);
    if (!c) { g.style.display = 'none'; return; }
    const st = d.status[id];
    const outside = c[0] > D || c[1] > D;
    if (outside) off++;
    g.style.display = '';
    g.setAttribute('class', `pt s${st}${outside ? ' is-off' : ''}${id === state.hover ? ' is-hover' : ''}${id === state.selected ? ' is-selected' : ''}`);
    g.style.transform = `translate(${sx(c[0]).toFixed(2)}px, ${sy(c[1]).toFixed(2)}px)`;
    g.querySelector('.dot').style.display = st === 1 ? 'none' : '';
    g.querySelector('.cross').style.display = st === 1 ? '' : 'none';
    g.querySelector('.halo').style.display = st === 3 ? '' : 'none';
    g.querySelector('.ring').style.display = id === state.selected ? '' : 'none';
  });
  // draw the fetch on top
  if (d.fetch >= 0) planeNodes[d.fetch].parentNode.append(planeNodes[d.fetch]);
  const label = $('planeFetchLabel');
  if (d.fetch >= 0) {
    const c = coords.get(d.fetch);
    label.textContent = `#${d.fetch}`;
    label.setAttribute('x', String(Math.min(sx(c[0]) + 10, x0 + size - 4)));
    label.setAttribute('y', String(Math.max(sy(c[1]) - 8, y0 - size + 10)));
  } else label.textContent = '';
  els.planeNote.textContent = off ? t('planeOff', { k: off }) : '';
}

// ---------- reason ----------
function renderReason() {
  const d = current(), data = currentData();
  const focus = state.selected >= 0 ? state.selected : state.hover >= 0 ? state.hover : d.fetch;
  els.reasonClear.hidden = !(state.selected >= 0 && state.selected !== d.fetch);
  const showTerms = (id) => {
    const rows = [];
    const sel = (id >= 0 && d.considered.includes(id)) ? id : -1;
    const fetch = d.fetch;
    const termsFor = (i) => (i < 0 ? null : [d.gap2[i], d.terms[0][i], d.terms[1][i], d.terms[2][i]]);
    const a = termsFor(sel === fetch ? -1 : sel), b = termsFor(fetch);
    if (!a && !b) { els.terms.hidden = true; return; }
    els.terms.hidden = false;
    els.termColSel.textContent = a ? `#${sel}` : '';
    els.termColFetch.textContent = b ? `#${fetch}` : '';
    const labels = [t('termGap'), ...[0, 1, 2].map((k) => t('termLayer', { layer: layerShort(k), w: fmtWeight(state.weights[k]) }))];
    const totalA = a ? a.reduce((s, v) => s + v, 0) : 0, totalB = b ? b.reduce((s, v) => s + v, 0) : 0;
    const scale = Math.max(totalA, totalB, 1);
    labels.forEach((label, r) => {
      const va = a ? a[r] : null, vb = b ? b[r] : null;
      rows.push(`<tr><td>${label}</td><td class="${va === 0 ? 'is-zero' : ''}">${va === null ? '' : fmtNum(va)}</td><td class="${vb === 0 ? 'is-zero' : ''}">${vb === null ? '' : fmtNum(vb)}</td>`
        + `<td class="bar-cell"><div class="bars">${va === null ? '' : `<i class="b-sel" style="width:${(va / scale) * 100}%"></i>`}${vb === null ? '' : `<i class="b-fetch" style="width:${(vb / scale) * 100}%"></i>`}</div></td></tr>`);
    });
    els.termsBody.innerHTML = rows.join('');
    els.termTotalSel.textContent = a ? fmtNum(totalA) : '';
    els.termTotalFetch.textContent = b ? fmtNum(totalB) : '';
  };
  els.reasonNote.textContent = '';
  if (focus < 0) {
    els.reasonTitle.innerHTML = `<span class="key key-blocked"></span>${t('whyNobody')}`;
    els.reasonText.innerHTML = t('reasonNobody');
    els.terms.hidden = true;
    return;
  }
  const st = d.status[focus];
  const keyClass = st === 3 ? 'key-fetch' : st === 2 ? 'key-pass' : st === 1 ? 'key-blocked' : 'key-other';
  els.reasonTitle.innerHTML = `<span class="key ${keyClass}"></span>${st === 3 ? t('whyFetch', { id: focus }) : t('whyNot', { id: focus })}`;
  if (st === 3) {
    els.reasonText.innerHTML = d.finalists.length > 1
      ? t('reasonTie', { list: d.finalists.filter((i) => i !== focus).map((i) => `#${i}`).join(lang === 'zh' ? '、' : ', '), id: focus })
      : t('reasonFetch');
    if (state.selected < 0 && state.hover < 0) els.reasonNote.textContent = t('reasonPick');
  } else if (st === 0) {
    els.reasonText.innerHTML = t('reasonBelow', { w: data.wanted[focus], t: d.threshold.toFixed(2) });
  } else if (st === 1) {
    const items = d.violations.get(focus).map((k) => t('reasonBlockedItem', { layer: t(`inline${LAYER_KEYS[k]}`), v: data.risks[k][focus], c: state.caps[k] }));
    els.reasonText.innerHTML = t('reasonBlocked', { list: items.join(lang === 'zh' ? '；' : '; ') });
    const better = d.survivors.filter((i) => d.dist[i] < d.dist[focus]).length;
    if (d.fetch < 0 || d.dist[focus] < d.best) els.reasonNote.textContent = d.fetch < 0 ? '' : t('reasonWouldWin', { d: fmtNum(d.dist[focus]), b: fmtNum(d.best) });
    else els.reasonNote.textContent = t('reasonWouldRank', { r: better + 1, k: d.survivors.length + 1 });
  } else {
    els.reasonText.innerHTML = t('reasonSurvivor', { d: fmtNum(d.dist[focus]), b: fmtNum(d.best), r: d.ranking.indexOf(focus) + 1, k: d.survivors.length });
  }
  if (st === 0) els.terms.hidden = true; else showTerms(focus);
}

// ---------- tooltip ----------
function renderTooltip(id) {
  const d = current(), data = currentData();
  if (id < 0) return;
  const st = d.status[id];
  const keyClass = st === 3 ? 'key-fetch' : st === 2 ? 'key-pass' : st === 1 ? 'key-blocked' : 'key-other';
  const note = st === 3 ? t('statusFetch') : st === 2 ? t('statusSurvivor', { r: d.ranking.indexOf(id) + 1, k: d.survivors.length }) : st === 1 ? t('statusBlocked') : t('statusBelow');
  els.tooltip.innerHTML = `<div class="tt-title"><span class="key ${keyClass}"></span>${t('tipCandidate', { id })}</div>`
    + `<div class="tt-grid"><span>wanted</span><b>${data.wanted[id]}</b>${[0, 1, 2].map((k) => `<span>${layerShort(k)}</span><b>${data.risks[k][id]}</b>`).join('')}</div>`
    + `<div class="tt-note">${note}</div>`;
  els.tooltip.hidden = false;
}
function positionTooltip(x, y) {
  const tip = els.tooltip;
  const w = tip.offsetWidth, h = tip.offsetHeight;
  let left = x + 16, top = y + 16;
  if (left + w > window.innerWidth - 8) left = x - w - 16;
  if (top + h > window.innerHeight - 8) top = y - h - 16;
  tip.style.transform = `translate(${Math.max(8, left)}px, ${Math.max(8, top)}px)`;
}
function hideTooltip() { els.tooltip.hidden = true; }

// ---------- whole-interface refresh ----------
function renderAll() {
  renderPolicy();
  renderReadout();
  renderPlane();
  renderReason();
  renderRounds();
}

function setHover(id, source) {
  if (id === state.hover) return;
  state.hover = id;
  if (id >= 0) renderTooltip(id); else hideTooltip();
  renderPlane();
  renderReason();
  scene3d?.setHover(id);
  if (source !== 'scene') els.canvas.classList.remove('is-hovering');
}
function setSelected(id) {
  state.selected = id;
  renderPlane();
  renderReason();
  scene3d?.setSelected(id);
}

// ---------- theme ----------
let theme = (() => {
  const saved = storage.get('wu-theme');
  if (saved === 'light' || saved === 'dark') return saved;
  return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
})();
function applyTheme(next, persist) {
  theme = next;
  document.documentElement.dataset.theme = theme;
  if (persist) storage.set('wu-theme', theme);
  renderThemeButton();
  scene3d?.setTheme(theme);
}
function renderThemeButton() {
  els.themeBtn.setAttribute('aria-label', theme === 'dark' ? t('themeToLight') : t('themeToDark'));
  els.themeBtn.title = els.themeBtn.getAttribute('aria-label');
}
window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', (event) => {
  if (!storage.get('wu-theme')) applyTheme(event.matches ? 'dark' : 'light', false);
});

// ---------- updates ----------
let lastFetch = null;
function policyOrRoundChanged({ heights = false } = {}) {
  const prev = lastFetch;
  const d = current();
  if (prev !== null && prev >= 0 && d.fetch !== prev) {
    trail = [...trail.filter((id) => id !== prev), prev].slice(-5);
  }
  lastFetch = d.fetch;
  if (state.selected >= 0 && state.selected >= state.n) state.selected = -1;
  renderAll();
  syncUrl();
  scene3d?.update({ heights, fetchChanged: prev !== null && prev !== d.fetch });
}

function loadPool({ n, cols, seed, kind }) {
  stopPlay();
  Object.assign(state, { n, cols, seed, kind, round: 0, selected: -1, hover: -1 });
  rebuildWorld();
  rebuildRounds();
  rebuildDecisions();
  lastFetch = current().fetch;
  buildPlaneNodes();
  hideTooltip();
  renderAll();
  syncUrl();
  scene3d?.setWorld({ reframe: true });
}

let policyFrame = 0;
function schedulePolicy() {
  cancelAnimationFrame(policyFrame);
  policyFrame = requestAnimationFrame(() => {
    rebuildDecisions();
    policyOrRoundChanged();
  });
}

els.presetGroup.addEventListener('click', (event) => {
  const button = event.target.closest('button');
  if (!button) return;
  const p = POLICIES[button.dataset.preset];
  state.weights = [...p.weights];
  state.caps = [...p.caps];
  schedulePolicy();
});
els.layerControls.addEventListener('input', (event) => {
  const input = event.target;
  if (input.type !== 'range') return;
  const k = Number(input.dataset.layer);
  if (input.dataset.kind === 'weight') state.weights[k] = Math.round(Number(input.value) * 100) / 100;
  else state.caps[k] = Number(input.value);
  schedulePolicy();
});
els.countSeg.addEventListener('click', (event) => {
  const button = event.target.closest('button');
  if (!button) return;
  loadPool(POOLS.find((p) => String(p.n) === button.dataset.n));
});
els.shuffleBtn.addEventListener('click', () => {
  let seed;
  do { seed = 1 + Math.floor(Math.random() * 99999); } while (seed === state.seed);
  const pool = POOLS.find((p) => p.n === state.n);
  loadPool({ n: state.n, cols: state.cols, seed, kind: pool && pool.seed === seed ? pool.kind : 'random' });
});
els.volInput.addEventListener('input', () => {
  state.volatility = Number(els.volInput.value);
  rebuildRounds();
  rebuildDecisions();
  policyOrRoundChanged({ heights: true });
});
els.roundStrip.addEventListener('click', (event) => {
  const button = event.target.closest('button');
  if (!button) return;
  stopPlay();
  goToRound(Number(button.dataset.round));
});
function goToRound(r) {
  state.round = r;
  policyOrRoundChanged({ heights: true });
}
let playTimer = 0;
function renderPlayButton() {
  const on = els.playBtn.getAttribute('aria-pressed') === 'true';
  els.playBtn.setAttribute('aria-label', on ? t('pause') : t('play'));
  els.playBtn.title = els.playBtn.getAttribute('aria-label');
  els.playBtn.querySelector('.i-play').style.display = on ? 'none' : '';
  els.playBtn.querySelector('.i-pause').style.display = on ? '' : 'none';
}
function stopPlay() {
  clearInterval(playTimer);
  playTimer = 0;
  els.playBtn.setAttribute('aria-pressed', 'false');
  renderPlayButton();
}
els.playBtn.addEventListener('click', () => {
  if (playTimer) { stopPlay(); return; }
  els.playBtn.setAttribute('aria-pressed', 'true');
  renderPlayButton();
  if (state.round >= ROUND_COUNT - 1) goToRound(0);
  playTimer = setInterval(() => {
    if (state.round >= ROUND_COUNT - 1) { stopPlay(); return; }
    goToRound(state.round + 1);
  }, 1100);
});
els.langSeg.addEventListener('click', (event) => {
  const button = event.target.closest('button');
  if (!button || button.dataset.lang === lang) return;
  lang = button.dataset.lang;
  storage.set('wu-lang', lang);
  renderStatic();
  renderAll();
  scene3d?.refreshText();
});
els.themeBtn.addEventListener('click', () => applyTheme(theme === 'dark' ? 'light' : 'dark', true));
els.reasonClear.addEventListener('click', () => setSelected(-1));
els.copyBtn.addEventListener('click', async () => {
  const text = els.pyCmd.textContent;
  try {
    await navigator.clipboard.writeText(text);
  } catch {
    const range = document.createRange();
    range.selectNodeContents(els.pyCmd);
    const selection = getSelection();
    selection.removeAllRanges();
    selection.addRange(range);
    document.execCommand('copy');
    selection.removeAllRanges();

  const DISPLACE = /* glsl */`
    float hBar = max(aHeight, 0.0);
    float sideSign = position.y > 0.0 ? 1.0 : -1.0;
    float squash = min(hBar / uBaseH, 1.0);
    transformed.y = position.y * squash + sideSign * 0.5 * max(hBar - uBaseH, 0.0) + uDir * 0.5 * hBar + uBaseY;
  `;
  function makeBarMaterial(dir) {
    const uniforms = {
      uBaseH: { value: BAR_BASE_H }, uDir: { value: dir }, uBaseY: { value: 0 },
      uDeep: { value: new THREE.Color() }, uDeepAmount: { value: 0.3 }, uDepthRange: { value: 2 },
      uCapY: { value: NO_CAP_Y }, uCapA: { value: new THREE.Color() }, uCapB: { value: new THREE.Color() }, uMute: { value: 0 }

      color: 0xffffff,
      roughness: dir > 0 ? 0.34 : 0.46,
      metalness: 0,
      clearcoat: dir > 0 ? 0.5 : 0.2,
      clearcoatRoughness: 0.28,
      specularIntensity: 0.7

    material.onBeforeCompile = (shader) => {
      Object.assign(shader.uniforms, uniforms);
      shader.vertexShader = shader.vertexShader
        .replace('#include <common>', `#include <common>
          attribute float aHeight;
          attribute float aGlow;
          uniform float uBaseH;
          uniform float uDir;
          uniform float uBaseY;
          varying float vGlow;
          varying float vBarY;
          varying float vStripe;`)
        .replace('#include <begin_vertex>', `#include <begin_vertex>
          ${DISPLACE}
          vGlow = aGlow;
          vBarY = transformed.y;
          vStripe = position.x - position.z;`);
      shader.fragmentShader = shader.fragmentShader
        .replace('#include <common>', `#include <common>
          uniform float uDir;
          uniform float uBaseY;
          uniform vec3 uDeep;
          uniform float uDeepAmount;
          uniform float uDepthRange;
          uniform float uCapY;
          uniform vec3 uCapA;
          uniform vec3 uCapB;
          uniform float uMute;
          varying float vGlow;
          varying float vBarY;

          diffuseColor.rgb = mix(diffuseColor.rgb, uDeep, depthFade * uDeepAmount);

          diffuseColor.rgb = mix(diffuseColor.rgb, vec3(grey) * 0.8 + 0.1, uMute * 0.8);

  const world3d = new THREE.Group();
  scene.add(world3d);
  const sheet = new THREE.Group();
  const sheetPlane = new THREE.Mesh(new THREE.PlaneGeometry(1, 1).rotateX(-Math.PI / 2), sheetMaterial);

  const layout = { cols: 1, rows: 1, k: 0.1, kr: 0.05, H: 4, Hr: 2, gap: 0.3, floors: [0, -2, -4], plateW: 2, plateD: 2, radius: 5, maxUp: 1, bottom: -6 };
  const palette = { fetch: new THREE.Color(), pass: new THREE.Color(), other: new THREE.Color(), blocked: new THREE.Color() };
  let themeName = theme;

  // displayed values and transition targets
  const disp = { up: null, layers: null, color: null, sheetY: 0 };

  const anim = { start: 0, duration: 1, stagger: null, colorStart: 0, colorDuration: 1, running: false };
  let pulseStart = -1e9;
  let trailDraw = { start: -1e9 };

  function computeLayout() {
    const n = state.n;
    layout.cols = Math.max(1, Math.min(state.cols, n));
    layout.rows = Math.ceil(n / layout.cols);
    const span = Math.max(layout.cols, layout.rows);
    layout.H = Math.min(9.5, Math.max(3.0, 0.4 * span + 1.5));
    layout.k = layout.H / 50;
    layout.Hr = layout.H * 0.42;
    layout.kr = layout.Hr / 50;
    layout.gap = Math.max(0.3, 0.06 * layout.H);
    layout.floors = [0, -(layout.Hr + layout.gap), -2 * (layout.Hr + layout.gap)];
    layout.bottom = layout.floors[2] - layout.Hr;
    layout.plateW = layout.cols * CELL + PLATE_MARGIN * 2;
    layout.plateD = layout.rows * CELL + PLATE_MARGIN * 2;
    layout.radius = Math.hypot(layout.plateW / 2, layout.plateD / 2, (layout.H - layout.bottom) / 2);

  const heightUp = (v) => Math.max(MIN_BAR_H, v * layout.k);
  const heightRisk = (v) => Math.max(MIN_BAR_H, v * layout.kr);

  function rectLoop(hw, hd, y = 0) {
    const geometry = new THREE.BufferGeometry();
    geometry.setAttribute('position', new THREE.Float32BufferAttribute([-hw, y, -hd, hw, y, -hd, hw, y, hd, -hw, y, hd], 3));

  }

  function buildPlates() {
    if (plateGroup) { world3d.remove(plateGroup); plateGroup.traverse((o) => { if (o.geometry) o.geometry.dispose(); }); }
    plateGroup = new THREE.Group();
    const { plateW, plateD, cols, rows } = layout;
    const plate = new THREE.Mesh(new RoundedBoxGeometry(plateW, PLATE_T, plateD, 3, 0.028), plateMaterial);
    const catcher = new THREE.Mesh(new THREE.PlaneGeometry(plateW, plateD).rotateX(-Math.PI / 2), catcherMaterial);

    sheetPlane.scale.set(plateW - 0.16, 1, plateD - 0.16);
    sheetEdge.geometry.dispose();
    sheetEdge.geometry = rectLoop((plateW - 0.16) / 2, (plateD - 0.16) / 2);
    capSheets.forEach((g) => {
      g.userData.plane.scale.set(plateW - 0.3, 1, plateD - 0.3);
      g.userData.edge.geometry.dispose();

    hemi.color.set(th.hemiSky); hemi.groundColor.set(th.hemiGround); hemi.intensity = th.hemi;
    keyLight.color.set(th.keyColor); keyLight.intensity = th.key;
    underLight.color.set(th.underColor); underLight.intensity = th.under;
    scene.environmentIntensity = th.env;
    plateMaterial.color.set(th.plate); plateMaterial.attenuationColor.set(th.attenuation); plateMaterial.roughness = th.plateRough;
    floorMaterial.color.set(th.floor); floorMaterial.opacity = th.floorOpacity;
    catcherMaterial.opacity = th.shadow;
    linesMaterial.color.set(th.lines); linesMaterial.opacity = th.linesOpacity;
    edgeMaterial.color.set(th.edge); edgeMaterial.opacity = th.edgeOpacity;
    sheetMaterial.color.set(th.pass); sheetEdgeMaterial.color.set(th.pass);
    capSheetMaterial.color.set(th.capSheet); capSheetMaterial.opacity = th.capSheetOpacity; capEdgeMaterial.color.set(th.capEdge);
    ringMaterial.color.set(th.fetch); glowMaterial.color.set(th.fetch); selectMaterial.color.set(th.select);
    for (const m of [upMaterial, ...layerMaterials]) {
      m.userData.uniforms.uDeep.value.set(th.deep);
      m.userData.uniforms.uDeepAmount.value = th.deepAmount;
      m.userData.uniforms.uCapA.value.set(th.capA);
      m.userData.uniforms.uCapB.value.set(th.capB);
    }
    layerMaterials.forEach((m, k) => { m.userData.uniforms.uDeepAmount.value = th.deepAmount + 0.07 * k; });
    if (bars) {
      computeTargets();
      disp.color.set(to.color);
      from.color.set(to.color);
      rebuildTrail(false);
      anim.running = true;
      anim.colorStart = 0;
      anim.colorDuration = 1;
    }
    requestRender();
  }

  // ---------- public api ----------
  function setWorld({ reframe: doReframe = false, intro = false } = {}) {
    hoverId = -1; selectedId = -1;
    computeLayout();
    buildPlates();
    buildBars();
    computeTargets();
    layout.maxUp = Math.max(...rounds.flatMap((r) => r.wanted)) * layout.k;
    disp.up.fill(0); disp.layers.forEach((a) => a.fill(0));
    for (let i = 0; i < state.n; i++) { disp.color[i * 3] = palette.other.r; disp.color[i * 3 + 1] = palette.other.g; disp.color[i * 3 + 2] = palette.other.b; }
    disp.sheetY = 0;
    snapshotFrom();
    trail = [];
    rebuildTrail(false);
    pulseStart = performance.now() + (reduceMotion.matches ? -2000 : 750);
    startTransition({ duration: 640, stagger: true, colorDelay: 820, colorDuration: 420 });
    chooseAngle();
    refreshText();
    if (intro) {
      const v = VIEWS.angle;
      const frame = solveFrame(v.theta, v.phi);
      viewOffset.x = frame.x; viewOffset.y = frame.y;
      applyViewOffset();
      const still = reduceMotion.matches;
      spherical.set(frame.radius * (still ? 1 : 1.25), v.phi + (still ? 0 : 0.1), v.theta - (still ? 0 : 0.55));
      camera.position.setFromSpherical(spherical);
      camera.lookAt(0, 0, 0);
      activeView = 'angle';
      startTween(v.theta, v.phi, frame, 2400);
    } else if (doReframe) {
      activeView = 'angle';
      goToView('angle', 800);
    }
  }
  function update({ heights = false, fetchChanged = false } = {}) {
    if (!bars) return;
    snapshotFrom();
    computeTargets();
    if (heights) layout.maxUp = Math.max(layout.maxUp, Math.max(...currentData().wanted) * layout.k);
    if (fetchChanged) { pulseStart = performance.now(); rebuildTrail(true); }
    else rebuildTrail(false);
    startTransition({ duration: heights ? 520 : 1, colorDelay: 0, colorDuration: 280 });
    refreshText();
  }
  function setHoverId(id) { hoverId = id; anim.running = true; requestRender(); }
  function setSelectedId(id) { selectedId = id; anim.running = true; requestRender(); }

  resize();
  setTheme(themeName);
  requestAnimationFrame(tick);
  if (new URLSearchParams(location.search).has('debug')) {
    window.__lab = { THREE, scene, camera, renderer, controls, layout, get bars() { return bars; }, requestRender, goToView };
  }
  function layoutChanged() { reframe(450); }
  return { setWorld, update, setTheme, refreshText, setHover: setHoverId, setSelected: setSelectedId, goToView, layoutChanged };
}

function showSceneError() {
  els.sceneError.textContent = t('sceneError');
  els.sceneError.hidden = false;
}

scene3d = await initScene();
if (scene3d) scene3d.setWorld({ intro: true });
</script>
